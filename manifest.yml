# Slack app manifest for the Hadron app (spec 043 decision 1: ONE Slack app,
# N workspace installs — a connection is one install of this app).
#
# Create the app at https://api.slack.com/apps → "From a manifest", paste
# this file, then:
#   1. Basic Information → App-Level Tokens → generate a token with the
#      connections:write scope (the xapp-… Socket Mode credential).
#   2. Install to the workspace → copy the Bot User OAuth Token (xoxb-…).
#   3. Register both with the tool: POST /connections {botToken, appToken}
#      (via core's createSlackConnection / `hadron slack connect`).
display_information:
  name: Hadron
  description: Search Hadron memory and run Hadron tasks from Slack.
  background_color: "#1a1d29"
features:
  bot_user:
    display_name: Hadron
    always_online: true
  slash_commands:
    - command: /hadron
      description: Search Hadron or run a task
      usage_hint: "find <query> | task <query> | link <token> | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      # Commands + replies.
      - commands
      - chat:write
      # Per-agent identity on bridge sends (username/icon_url overrides).
      - chat:write.customize
      # Sender resolution (get-user-info).
      - users:read
      # Bridge inbound + gap backfill; groups:* covers private channels —
      # groups:read is required for conversations.info there (PR #594).
      - channels:history
      - channels:read
      - groups:history
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      # The bridge inbound (spec 043 Phase 3).
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
